<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#181d23" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1270" height="760" fill="url(#bg)"/>
  <rect width="1270" height="760" fill="url(#grid)"/>

  <!-- Top bar -->
  <rect x="100" y="100" width="48" height="3" fill="#22d3ee"/>
  <text x="160" y="108" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="14" fill="#6b7280" letter-spacing="2.5">
    CLAUDE CODE PLUGIN
  </text>

  <!-- Logo -->
  <g transform="translate(100, 150) scale(2.6)">
    <g fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18,18 8,32 18,46"/>
      <polyline points="46,18 56,32 46,46"/>
    </g>
    <g fill="#22d3ee">
      <rect x="22" y="34" width="9" height="8" rx="1.2"/>
      <rect x="33" y="34" width="9" height="8" rx="1.2"/>
      <rect x="27.5" y="24" width="9" height="8" rx="1.2"/>
    </g>
  </g>

  <!-- Product name -->
  <text x="280" y="240" font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="92" fill="#f5f5f5" font-weight="800" letter-spacing="-3">
    web-builder
  </text>

  <!-- Tagline -->
  <text x="282" y="290" font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="28" fill="#9ca3af" font-weight="400">
    Describe a website. Get a working, deployable project.
  </text>

  <!-- Visual metaphor: prompt -> wireframe -->
  <!-- Left: prompt card -->
  <g transform="translate(100, 400)">
    <rect x="0" y="0" width="440" height="240" rx="10" fill="#0f1318" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- title bar dots -->
    <circle cx="20" cy="22" r="5" fill="#27313a"/>
    <circle cx="38" cy="22" r="5" fill="#27313a"/>
    <circle cx="56" cy="22" r="5" fill="#27313a"/>
    <line x1="0" y1="44" x2="440" y2="44" stroke="#1a1f25" stroke-width="1"/>
    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="18">
      <text x="22" y="84" fill="#22d3ee">&gt;</text>
      <text x="44" y="84" fill="#d1d5db">A landing page for</text>
      <text x="22" y="114" fill="#d1d5db">a coffee subscription,</text>
      <text x="22" y="144" fill="#d1d5db">dark theme, hero CTA,</text>
      <text x="22" y="174" fill="#d1d5db">pricing table, deploy</text>
      <text x="22" y="204" fill="#d1d5db">to Vercel.</text>
    </g>
  </g>

  <!-- Arrow -->
  <g stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="570" y1="520" x2="690" y2="520"/>
    <polyline points="670,505 690,520 670,535"/>
  </g>

  <!-- Right: site wireframe -->
  <g transform="translate(720, 400)">
    <rect x="0" y="0" width="450" height="240" rx="10" fill="#0f1318" stroke="#2a3340" stroke-width="1.5"/>
    <!-- nav -->
    <rect x="18" y="18" width="60" height="10" rx="2" fill="#22d3ee"/>
    <rect x="340" y="20" width="40" height="6" rx="2" fill="#3a444f"/>
    <rect x="388" y="20" width="40" height="6" rx="2" fill="#3a444f"/>
    <line x1="0" y1="46" x2="450" y2="46" stroke="#1a1f25" stroke-width="1"/>
    <!-- hero -->
    <rect x="18" y="68" width="280" height="18" rx="3" fill="#e5e7eb"/>
    <rect x="18" y="94" width="220" height="10" rx="3" fill="#4b5563"/>
    <rect x="18" y="110" width="180" height="10" rx="3" fill="#4b5563"/>
    <rect x="18" y="140" width="96" height="28" rx="5" fill="#22d3ee"/>
    <!-- preview tiles -->
    <rect x="18" y="186" width="130" height="38" rx="4" fill="#1a1f25"/>
    <rect x="160" y="186" width="130" height="38" rx="4" fill="#1a1f25"/>
    <rect x="302" y="186" width="130" height="38" rx="4" fill="#1a1f25"/>
  </g>

  <!-- Footer -->
  <text x="100" y="710" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="14" fill="#6b7280">
    /web-builder
  </text>
  <text x="1170" y="710" text-anchor="end"
        font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="14" fill="#6b7280">
    Open source - MIT
  </text>
</svg>
