<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111418"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1a1f24" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- accent rule top-left -->
  <rect x="80" y="120" width="64" height="4" fill="#22d3ee"/>

  <!-- Logo at left -->
  <g transform="translate(80, 240) scale(3.2)">
    <g fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18,18 8,32 18,46"/>
      <polyline points="46,18 56,32 46,46"/>
    </g>
    <g fill="#22d3ee">
      <rect x="22" y="34" width="9" height="8" rx="1.2"/>
      <rect x="33" y="34" width="9" height="8" rx="1.2"/>
      <rect x="27.5" y="24" width="9" height="8" rx="1.2"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="370" y="270" font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="26" fill="#9ca3af" font-weight="400" letter-spacing="0.5">
    Describe a website. Get a working, deployable project.
  </text>

  <!-- Product name -->
  <text x="370" y="380" font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="104" fill="#f5f5f5" font-weight="800" letter-spacing="-3">
    web-builder
  </text>

  <!-- Terminal prompt line -->
  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="22">
    <text x="370" y="470" fill="#22d3ee">$</text>
    <text x="394" y="470" fill="#d1d5db">claude</text>
    <text x="478" y="470" fill="#6b7280">/web-builder</text>
  </g>

  <!-- Footer label -->
  <text x="80" y="570" font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="18" fill="#6b7280" letter-spacing="2">
    CLAUDE CODE PLUGIN
  </text>
  <text x="1120" y="570" text-anchor="end"
        font-family="ui-sans-serif, -apple-system, Inter, system-ui, sans-serif"
        font-size="18" fill="#6b7280">
    MIT licensed
  </text>
</svg>
